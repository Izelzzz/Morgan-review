name: setup-python-env
description: Install the uv version pinned in pyproject.toml, Python, and the locked environment.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: "3.12"
    - run: uv sync --locked
      shell: bash
