- id: e2
  must: true
  severity_min: robustness
  file: src/review_agents/pipeline/run.py
  lines:
  - 286
  - 292
  root_cause: per_call is computed once, when the job starts, and the same model is used for every turn
    of the agent; later calls are not bounded by the time left, so a job left behind at the deadline can
    run up to three full attempts past it, adding to the next review's concurrency and cost.
  evidence: https://github.com/Izelzzz/Morgan-review/commit/c6c19b67fe260d9ddd536b30390e61f29197830b
