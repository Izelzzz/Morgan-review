pr:
  title: 'feat(pipeline): 一次审查从领取到写入——并行维度、截止时间与隔离（issue #9 第 2 部分）'
  body: 'feat(pipeline): run a review end to end, dimensions side by side under a deadline


    run_review takes a claimed review from mirror sync and config to stored

    findings: the repository and PR layers, the context packs, then every

    enabled dimension of every group in parallel (model_concurrency at a time)

    until the dimension deadline, which keeps a wrap-up reserve of up to a third

    of the review. A dimension that fails or runs out of time ends alone and is

    recorded in steps; the review''s limit_hit names the most severe limit any

    dimension hit. All findings are written in one transaction, with a

    fingerprint of their file and code. Between steps a review superseded by a

    newer push stops without writing anything (D-010).


    Missing module summaries are written in a background thread, so a

    repository''s first review does not spend its time on them. After a restart

    a review without a token is queued once more (D-021); the worker counts

    attempts. The service runs the pipeline when a finder model is configured.

    The steps run in plain Python, without LangGraph (D-023).


    Refs #9

    '
