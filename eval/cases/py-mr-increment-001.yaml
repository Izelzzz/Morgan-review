pr:
  title: 'feat(context): work out what a later round reviews'
  body: 'feat(context): work out what a later round reviews


    Issue #12, D-026. `increment()` gives the head-side lines to review since

    the previously reviewed head: the lines changed between the two heads that

    are also the PR''s own changes against the default branch. What a merge or

    a rebase brings in from the default branch drops out; a place where the

    author took back something the PR had added counts, as one line where it

    was. An empty increment means nothing new to review; without the previous

    head (force-pushed away, never fetched) it returns None, a full review.


    Not wired into the pipeline yet: that follows PR #84, which changes the

    same code.

    '
