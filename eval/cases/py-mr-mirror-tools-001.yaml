pr:
  title: 'feat(mirror): 仓库镜像与只读工具'
  body: 'feat(mirror): keep one bare git mirror per repository


    Each review fetches only the refs it needs into /data/repos/<owner>/<name>.git,

    so later reviews transfer only new objects. The read-only token reaches git

    through GIT_CONFIG_* environment variables: it is never written to the mirror,

    a remote URL or the process arguments, and is masked in git error messages.


    Refs #6


    feat(tools): add the agents'' read-only repository tools


    read_file, list_dir, search_code, git_log and read_issue read straight from git

    objects at the reviewed commit, so no files are checked out and a symlink in a

    pull request cannot reach the host. Skip rules, the 200 KB limit and binary

    detection apply to every tool, and a budget stops an agent after 25 calls.


    Refs #6


    build: install git in the runtime image


    The mirror and the repository tools call git.


    Refs #6

    '
