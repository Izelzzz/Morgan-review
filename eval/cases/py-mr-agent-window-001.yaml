pr:
  title: 'feat(agents): 工具结果截长、对话快满时截短、绕圈提醒'
  body: "feat(agents): keep tool results within the model's window\n\nDecision D-030, items 3 and 4. A\
    \ context pack may take four fifths of the\nwindow, which leaves a 128k model about 25k tokens for\
    \ all tool results,\nwhile one read_file may return 200 KB: a single read could overflow the\nwindow\
    \ and fail the agent.\n\n- A tool result over 10,000 tokens keeps its head and tail by whole lines,\n\
    \  with a note on what was left out and, for read_file, how to read it by\n  line range. Lines too\
    \ long to keep whole are cut by characters, bounded\n  for scripts of more than a token a byte.\n\
    - Before each model call, when the conversation and a 4,000-token reply\n  would not fit the window,\
    \ the oldest results are cut to a 500-token head\n  and tail first. Results are re-wrapped in their\
    \ data block, so a cut never\n  breaks it; nothing calls a model or summarises.\n- The third time\
    \ an agent makes the exact same call, the result reminds it\n  to change course or submit.\n\nThe\
    \ three numbers are server settings.\n"
