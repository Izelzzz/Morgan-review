pr:
  title: 'feat(models): 模型调用改流式，按 D-030 规则重试'
  body: 'feat(models): stream replies and retry by the review''s own rules


    Decisions D-029 and D-030. Replies stream, and a stream that sends no data

    at all, heartbeats included, for five minutes is stalled; a reply that keeps

    coming is never cut, so a hard per-call deadline now gives up an attempt

    still running when its time is up. Each model can turn streaming off, and

    then a whole reply must arrive within two minutes.


    The client''s own retries are off. Rate limits, server errors, stalls,

    broken connections and an empty reply with no finish reason are retried up

    to four times, waiting from half a second, doubling, at most ten seconds,

    ±10%, or the service''s Retry-After up to thirty; no wait runs past the

    deadline. Request and permission errors, and an empty reply cut by the

    output limit, are not retried.


    Callers now pass the seconds left to the deadline instead of dividing them

    among the client''s retries. The SDK''s HTTP client is httpx2, so its types

    are used for the timeout and headers.

    '
