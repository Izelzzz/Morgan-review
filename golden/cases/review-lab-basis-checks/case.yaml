pr:
  title: "feat(basis): every finding states its basis, and the program checks each one"
  body: |
    D-036: a finding's free-text evidence becomes a list of bases, each a quoted
    rule (spec, contract, convention) or a traced path, with the code it points at.
    The program checks every basis when the dimension agent hands in: files and
    lines exist, the quote is in its source (a file, the PR description or a linked
    issue). A quote found at other lines of its file gets those lines; a basis that
    does not check out says why and goes to the verifier, which sees each basis and
    its check. Quick mode, which has no verifier, publishes a blocking or important
    finding only on a basis that checked out. The shared rules ask for bases; the
    findings table stores them in place of evidence.

    Refs #68
  issues:
    - number: 68
      title: "🔴 / 🟡 的结构化依据：规格、接口契约、约定、触发路径"
      body: |
        **背景：** 每条发现的「证据」是一段自由文字，程序只能查写没写；验证审查员的证据只有「文件、行号、说明」（D-032）。读的人要自己去找依据。
        **目的：** 每条发出去的 🔴 / 🟡 都有可核对的依据：在哪个文档、哪条规则或契约、代码哪几行不符、为什么；或者从哪里出发、经过哪里、在哪里出错。
        **决策：** D-036 · **设计文档：** [结构化依据](https://app.notion.com/p/413e1787b65081e1b423f01ee4fb9f57)
        **代码分支：** `feat/multi-review-agents`

        ## 范围
        - 发现的 `evidence`（自由文字）换成 `basis`（依据列表），四种：`spec`、`contract`、`convention`（来源 + 一字不差的原文 + 不符的代码位置 + 为什么）、`path`（按顺序的位置 + 为什么）。🔴 / 🟡 至少一条，🔵 / ⚪ 不强制。
        - 来源只认被审提交里的文件、PR 描述、本 PR 关联的 issue；原文最长 300 字。
        - 程序核对：文件存在、行号在范围内、原文出现在那里（忽略空白差异）。只是行号偏了就改成实际位置；核对不上的标上「核对不上：原因」，维度审查员不重交。
        - 验证审查员看到每条依据和核对结果；它的结论也改用这四种依据，同样核对，判成立至少一条。
        - Quick 模式下依据核对不上的 🔴 / 🟡 不发布。
        - 共享规则 `skills/_shared.md` 的 Evidence、Output 两节按设计文档 §7 改；数据库存依据列表和核对结果。

        ## 验收
        - [x] 编造的文件、超出的行号、找不到的原文都被标为核对不上，原因写明
        - [x] 原文一字不差但行号写错时，程序改成正确行号
        - [x] 验证审查员判成立的每条都至少有一条核对通过的依据
        - [x] Quick 模式下依据核对不上的 🔴 / 🟡 不发布
        - [ ] review-lab 的 4 个 bug 题里，每条 🔴 / 🟡 都带可核对的依据（在 #17 的评测里看）

        **依赖：** 无

